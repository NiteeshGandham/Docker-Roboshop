services:
  mongodb:
    image: ./mongodb
    build: mongodb:1.0.0
    container_name: mongodb

  redis:
    image: ./redis
    build: redis:1.0.0
    container_name: redis

  mysql:
    image: ./mysql
    build: mysql:1.0.0
    container_name: mysql

  rabbitmq:
    image: ./rabbitmq
    build: rabbitmq:1.0.0
    container_name: rabbitmq

  catalogue:
    image: ./catalogue
    build: catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb

  user:
    image: ./user
    build: user:1.0.0
    container_name: user
    depends_on:
    - mongodb
    - redis
    - catalogue

  cart:
    image: ./cart
    build: cart:1.0.0
    container_name: cart
    depends_on:
    - redis
    - catalogue

  shipping:
    image: ./shipping
    build: shipping:1.0.0
    container_name: shipping
    depends_on:
    - mysql
    - cart

  payment:
    image: ./payment
    build: payment:1.0.0
    container_name: payment
    depends_on:
    - rabbitmq
    - cart
    - user
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
  

  frontend:
    image: ./frontend
    build: frontend:1.0.0
    container_name: frontend
    depends_on:
    - catalogue
    - cart
    - user
    - shipping
    - payment