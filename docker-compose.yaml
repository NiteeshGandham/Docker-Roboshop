services:
  mongodb:
    build: ./mongodb
    image: mongodb:1.0.0
    container_name: mongodb

  redis:
    build: ./redis
    image: redis:1.0.0
    container_name: redis

  mysql:
    build: ./mysql
    image: mysql:1.0.0
    container_name: mysql

  rabbitmq:
    build: ./rabbitmq
    image: rabbitmq:1.0.0
    container_name: rabbitmq

  catalogue:
    build: ./catalogue
    image: catalogue:1.0.0
    container_name: catalogue
    depends_on:
    - mongodb

  user:
    build: ./user
    image: user:1.0.0
    container_name: user
    depends_on:
    - mongodb
    - redis
    - catalogue

  cart:
    build: ./cart
    image: cart:1.0.0
    container_name: cart
    depends_on:
    - redis
    - catalogue

  shipping:
    build: ./shipping
    image: shipping:1.0.0
    container_name: shipping
    depends_on:
    - mysql
    - cart

  payment:
    build: ./payment
    image: payment:1.0.0
    container_name: payment
    depends_on:
    - rabbitmq
    - cart
    - user
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
  

  frontend:
    build: ./frontend
    image: frontend:1.0.0 #docker build -t frontend:1.0.0
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - cart
    - user
    - shipping
    - payment

networks:
  default:
    driver: bridge
    name: roboshop
    external: false #if true, we need to create network manually  
